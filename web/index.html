<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>磁力聚合搜索 · magnet-agg</title>
  <link rel="stylesheet" href="/style.css?v=disc1" />
</head>
<body>
  <header class="bar">
    <h1>磁力聚合搜索</h1>
    <nav><a href="/admin.html">后台设置</a> · <a href="#" id="logout">退出</a></nav>
  </header>
  <main>
    <form id="f">
      <input id="q" type="search" placeholder="输入影视关键词，例如：三体" autocomplete="off" required />
      <button type="submit">搜索</button>
    </form>
    <div id="meta"></div>
    <div id="list"></div>
    <section id="discover">
      <div class="disc-head">
        <h2>TMDB 最新推荐</h2>
        <div class="disc-tabs">
          <button type="button" class="ghost on" data-kind="movie">电影</button>
          <button type="button" class="ghost" data-kind="tv">剧集</button>
        </div>
      </div>
      <p id="discMeta" class="muted">加载中…</p>
      <div id="discGrid" class="poster-grid"></div>
    </section>
  </main>
  <div id="fab" hidden></div>
  <script src="/app.js?v=disc1"></script>
</body>
</html>
