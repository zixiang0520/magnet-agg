services:
  magnet-agg:
    build: .
    image: magnet-agg:local
    container_name: magnet-agg
    restart: unless-stopped
    ports:
      - "28910:8080"
    volumes:
      - ./data:/app/data
    environment:
      - LISTEN=:8080
      - CONFIG=/app/data/config.json
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
