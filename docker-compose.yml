services:
  magnet-agg:
    build: .
    image: magnet-agg:local
    container_name: magnet-agg
    restart: unless-stopped
    ports:
      - "28910:8080"
    environment:
      - LISTEN=:8080
      - SITE6V_BASE=https://www.6v520.com
      # 外网源（apibay / yts）走 v2raya；6v 插件内强制直连
      - APIBAY_PROXY=http://192.168.1.100:20172
      - TORRENTSCSV_PROXY=http://192.168.1.100:20172
      # yts.mx 在本网 TLS 常失败；需要时设 ENABLE_YTS=1 并配 YTS_PROXY
      # - ENABLE_YTS=1
      # - YTS_PROXY=http://192.168.1.100:20172
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
