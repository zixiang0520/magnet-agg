services:
  magnet-agg:
    build: .
    image: magnet-agg:local
    container_name: magnet-agg
    restart: unless-stopped
    ports:
      - "28910:8080"
    environment:
      - LISTEN=:8080
      - SITE6V_BASE=https://www.6v520.com
      # 仅 apibay 使用（代码读 APIBAY_PROXY）；6v 直连
      - APIBAY_PROXY=http://192.168.1.100:20172
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
